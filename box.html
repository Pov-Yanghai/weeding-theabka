    <style>
        /* 1. Video background setup */
        .video-bg {
            position: fixed;
            /* Fixes it to the screen */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Fills screen without stretching */
            z-index: -1;
            /* Puts it behind text */
        }

        /* 2. Text container setup */
        .box-text {
            position: absolute;
            top: 45%;
            left: 50%;
            /* Combine centering and animation starting point */
            transform: translate(-50%, -50%);
            text-align: center;
            color: #e6a72a;
            font-family: 'Moul', sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            /* Smoother shadow */
            white-space: nowrap;
            width: max-content;

            /* Ensure the container doesn't hide the animation */
            overflow: visible;
        }

        .box-text h1 {
            font-size: 28px;
            /* Slightly larger for the Moul font */
            margin: 0;
            font-weight: bold;
            margin-top: -230px;
            display: block;
        }

        /* Custom Animation Fix */
        /* This ensures the 'Up' movement doesn't break the 'Center' positioning */
        @keyframes customFadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, -40%);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        /* 1. The Entrance (Fade and Slide Up) */
        @keyframes customFadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, -40%);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        /* 2. The Elegant Glow (Gold Pulse) */
        @keyframes goldGlow {

            0%,
            100% {
                text-shadow: 0 0 5px rgba(230, 167, 42, 0.5);
            }

            50% {
                text-shadow: 0 0 20px rgba(230, 167, 42, 0.8), 1px 1px 2px #000;
            }
        }

        /* 3. The Gentle Float (Floating movement) */
        @keyframes gentleFloat {

            0%,
            100% {
                margin-top: 0px;
            }

            50% {
                margin-top: -10px;
            }
        }

        .refined-animation {
            /* Applying multiple animations separated by commas */
            /* Name | Duration | Timing | Delay | Iteration | Direction */
            animation:
                customFadeInUp 1s ease-out forwards,
                goldGlow 2s ease-in-out infinite,
                gentleFloat 2s ease-in-out infinite;

            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e6a72a;
            font-family: 'Moul', sans-serif;
            white-space: nowrap;
        }

        .box-text h5 {
            font-weight: 600;
            font-size: 15px;
            margin: 0;
        }

        .box-text h2 {
            font-weight: bold;
            font-size: 30px;
            margin-top: -80px;
            font-family: "Moulpali", sans-serif !important;
            line-height: 0.1rem;
            font-weight: bold;
            text-align: start;
        }


        /* Buttom */


        /* Container to handle positioning */
        .button-container {
            position: fixed;
            bottom: 120px;
            /* Adjust height from bottom */
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Styling the anchor tag to look like a button */
        .khmer-wedding-btn {
            display: inline-block;
            /* Essential for <a> tags to accept padding/width */
            text-decoration: none;
            /* Removes the underline */
            padding: 14px 30px;
            font-family: 'Moul', sans-serif;
            font-size: 10px;
            color: #ffffff !important;
            /* Forces white text */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            cursor: pointer;

            /* Golden Gradient Background */
            background: linear-gradient(180deg, #ffd500 0%, #d89000 50%, #ffd500 100%);

            /* The Shape */
            clip-path: polygon(8% 0%, 92% 0%,
                    100% 30%, 100% 70%,
                    92% 100%, 8% 100%,
                    0% 70%, 0% 30%);

            /* Shadow and Glow */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* Interaction Effects */
        .khmer-wedding-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .khmer-wedding-btn:active {
            transform: scale(0.95);
        }
    </style>

<script>


    document.querySelector('.khmer-wedding-btn').addEventListener('click', function (e) {
        e.preventDefault(); // Stop the instant jump
        const targetUrl = this.getAttribute('href');

        // Add a fade-out effect to the body
        document.body.style.transition = "opacity 0.5s ease";
        document.body.style.opacity = "0";

        // Navigate after the animation finishes
        setTimeout(function () {
            window.location.href = targetUrl;
        }, 500);
    });
</script>
