    <style>
    /* 1. Video background setup */
    .video-bg {
        position: fixed; /* Fixes it to the screen */
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* Fills screen without stretching */
        z-index: -1; /* Puts it behind text */
    }

    /* 2. Text container setup */
    .box-text {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #e6a72a;
        font-family: 'Moul', sans-serif;
        text-shadow: 1px 1px 1px #000000;
        
        /* Forces the text to stay on one single line */
        white-space: nowrap; 
        width: max-content; 
    }

    .box-text h1 {
        font-size: 25px;
        margin-bottom: 10px;
        display: block;
        margin-top: -250px;
    }

    .box-text h5 {
        font-weight: 600;
        font-size: 15px;
        margin: 0;
    }

    .box-text h2 {
        font-weight: 600;
        font-size: 15px;
        margin-top: -100px;
        font-family: "Moulpali", sans-serif !important;

    }

    /* Adjust font size for very small screens so it doesn't overflow */

        .box-text h1 { font-size: 18px; }
        .box-text h5 { font-size: 13px; }
    }

/* Buttom */


 /* Container to handle positioning */
.button-container {
    position: fixed;
    bottom: 120px; /* Adjust height from bottom */
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: 100%;
    display: flex;
    justify-content: center;
}

/* Styling the anchor tag to look like a button */
.khmer-wedding-btn {
    display: inline-block; /* Essential for <a> tags to accept padding/width */
    text-decoration: none; /* Removes the underline */
    padding: 14px 30px;
    font-family: 'Moul', sans-serif;
    font-size: 10px;
    color: #ffffff !important; /* Forces white text */
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
    cursor: pointer;
    
    /* Golden Gradient Background */
    background: linear-gradient(180deg, #ffd500 0%, #d89000 50%, #ffd500 100%);
    
    /* The Shape */
    clip-path: polygon(
        8% 0%, 92% 0%, 
        100% 30%, 100% 70%, 
        92% 100%, 8% 100%, 
        0% 70%, 0% 30%
    );

    /* Shadow and Glow */
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
}

/* Interaction Effects */
.khmer-wedding-btn:hover {
    transform: scale(1.05);
    filter: brightness(1.1);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}

.khmer-wedding-btn:active {
    transform: scale(0.95);
}
</style>

<script>
document.querySelector('.khmer-wedding-btn').addEventListener('click', function(e) {
    e.preventDefault(); // Stop the instant jump
    const targetUrl = this.getAttribute('href');

    // Add a fade-out effect to the body
    document.body.style.transition = "opacity 0.5s ease";
    document.body.style.opacity = "0";

    // Navigate after the animation finishes
    setTimeout(function() {
        window.location.href = targetUrl;
    }, 500); 
});
</script>
