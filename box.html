      .wedding-date-bg {
    width: 100% !important;
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
    overflow: hidden;
}

.wedding-date-bg .container {
    width: 100% !important;
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
}

/* 2. Fix the background image styling */
.wedding-date-bg .wedding-date {
    position: relative;
    width: 100% !important;
    min-height: 100vh; /* Full screen height */
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    
    /* Background logic */
    background: linear-gradient(
        rgba(0, 0, 0, 0.2),
        rgba(0, 0, 0, 0.4)
    ),
    url(images/image.png);
    
    background-position: center center;
    background-size: cover; /* This removes the pink sidebars */
    background-repeat: no-repeat;
    overflow: hidden;
}

/* 3. Ensure the content stays on top and centered */
.wedding-date-bg .wedding-date-content {
    position: relative;
    z-index: 10;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Removed the massive 500px margin-top to let Flexbox handle centering */
}

/* 4. Fix for the overlay to prevent it from blocking layout */
.wedding-date-bg .wedding-date::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

/* 5. Fix for the date header box */
.wedding-date-bg .wedding-date-content .d-inline-block {
    margin-top: 0 !important; /* Overriding your inline 500px margin */
    margin-bottom: 2rem !important;
    border-color: rgba(255, 255, 255, 0.5) !important;
}

    <h1 class="wedding-name">សិរីមង្គលអាពាហ៍ពិពាហ៍</h1>
    <div class="weddingAbout mb-5 px-3">
        <p class="text-center mb-0" style="font-size: 16px; font-family: 'Moul', serif; line-height: 1.6;">
            លោក ហង្ស តេង និង កញ្ញា សុភា ជូនគោរពអញ្ជើញ<br>
            លោកអ្នក និងគ្រួសារមករួមជាមួយពួកយើង<br>
            ក្នុងពិធីអាពាហ៍ពិពាហ៍ ដែលនឹងប្រព្រឹត្តទៅ<br>
            ថ្ងៃព្រហស្បតិ៍ ទី ១២ ខែកុម្ភៈ ឆ្នាំ ២០២៦<br>
            នៅសាលារៀន ព្រះសុរិយោដម<br>
            ចាប់ពីម៉ោង ៩:០០ ព្រឹក រហូតដល់ម៉ោង ១២:០០ រសៀល<br>
            សូមអរគុណ!
        </p>
