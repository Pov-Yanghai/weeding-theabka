<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Moul&family=Moulpali&family=Tangerine:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <title>សូមគោរពអញ្ជើញ</title>

    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fae6f7;
            width: 100%;
            /* Use dvh to account for mobile browser address bars */
            height: 100dvh;
            overflow: hidden;
            /* Prevents accidental scrolling */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Video Background */
        .video-bg {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Main Container to handle spacing */
        .content-wrapper {
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Pushes top and bottom apart */
            padding: 40px 20px;
            /* Safe padding */
        }

        .header-title {
            text-align: center;
            color: #e6a72a;
            font-family: 'Moul', sans-serif;
            margin-top: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header-title h1 {
            font-size: 1.8rem;
        }

        /* Centered Names Section */
        .couple-names {
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #e6a72a;
        }

        .couple-names h2 {
            font-family: "Moulpali", sans-serif;
            font-size: 2.2rem;
            margin: 5px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            line-height: 1.4;
        }

        .couple-names sub {
            font-family: 'Tangerine', cursive;
            font-size: 28px;
            vertical-align: middle;
        }

        /* Button Section */
        .button-container {
            text-align: center;
            padding-bottom: 0px;
            margin-bottom: -10px;
        }

        .invite-text {
            color: #e6a72a;
            font-family: 'Moul', sans-serif;
            margin-bottom: 30px;
            font-size: 1.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .khmer-wedding-btn {
            display: inline-block;
            text-decoration: none;
            padding: 15px 35px;
            font-family: 'Moul', sans-serif;
            font-size: 14px;
            color: #ffffff !important;
            background: linear-gradient(180deg, #ffd500 0%, #d89000 50%, #ffd500 100%);
            clip-path: polygon(8% 0%, 92% 0%, 100% 30%, 100% 70%, 92% 100%, 8% 100%, 0% 70%, 0% 30%);
            transition: all 0.3s ease;
            border: none;
        }

        @keyframes goldGlow {

            0%,
            100% {
                text-shadow: 0 0 5px rgba(230, 167, 42, 0.5);
            }

            50% {
                text-shadow: 0 0 20px rgba(230, 167, 42, 0.8), 1px 1px 2px #000;
            }
        }

        .refined-animation {
            animation: goldGlow 2s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <video autoplay loop muted playsinline class="video-bg">
        <source src="video/4fa40e6d-9c22-4403-9099-97cdc73c3dfa.mp4" type="video/mp4">
    </video>

    <div class="content-wrapper">
        <div class="header-title" data-aos="fade-down" data-aos-duration="2000">
            <h1>សិរីមង្គលអាពាហ៍ពិពាហ៍</h1>
        </div>

        <div class="couple-names">
            <div data-aos="fade-left" data-aos-duration="2000">
                <h2>ភក្តី <sub>Pheakdey</sub></h2>
            </div>
            <div data-aos="fade-right" data-aos-duration="2000">
                <h2>សម្បត្តិ <sub>Sambath</sub></h2>
            </div>
        </div>

        <div class="button-container" data-aos="fade-up" data-aos-duration="2000">
            <h5 class="invite-text">សូមគោរពអញ្ជើញ</h5>
            <a href="case.html" id="openInvite" class="khmer-wedding-btn refined-animation">
                សូមចុចដើម្បីបើកសំបុត្រ
            </a>
        </div>
    </div>

    <audio id="weddingMusic" loop autoplay controls hidden>
        <source src="video/e0e1e80604494583be03519a5fe9fd4f.mp3" type="audio/mpeg">
    </audio>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // Music Persistence Logic
        const audio = document.getElementById("weddingMusic");

        window.addEventListener("DOMContentLoaded", () => {
            const savedTime = localStorage.getItem("musicTime");
            if (savedTime) audio.currentTime = parseFloat(savedTime);

            // Note: Autoplay often requires user interaction first
            audio.play().catch(error => console.log("Autoplay blocked until user interaction."));
        });

        setInterval(() => {
            if (!audio.paused) localStorage.setItem("musicTime", audio.currentTime);
        }, 1000);

        // Page Transition Logic
        document.getElementById('openInvite').addEventListener('click', function (e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');
            document.body.style.transition = "opacity 0.5s ease";
            document.body.style.opacity = "0";
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 500);
        });
    </script>
</body>

</html>
